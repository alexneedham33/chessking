name: Install Stockfish engine
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/install-stockfish.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download pinned Stockfish 17.1 engine from npm
        run: |
          set -euo pipefail
          mkdir -p /tmp/stockfish-pkg
          npm pack stockfish@17.1.0 --pack-destination /tmp/stockfish-pkg
          tar -xzf /tmp/stockfish-pkg/stockfish-17.1.0.tgz -C /tmp/stockfish-pkg
          cp /tmp/stockfish-pkg/package/src/stockfish-17.1-lite-single-03e3232.js .
          cp /tmp/stockfish-pkg/package/src/stockfish-17.1-lite-single-03e3232.wasm .
          test -s stockfish-17.1-lite-single-03e3232.js
          test -s stockfish-17.1-lite-single-03e3232.wasm
      - name: Commit engine assets to chessking
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stockfish-17.1-lite-single-03e3232.js stockfish-17.1-lite-single-03e3232.wasm
          if ! git diff --cached --quiet; then
            git commit -m "Bundle Stockfish 17.1 WebAssembly engine"
            git push origin HEAD:main
          fi
