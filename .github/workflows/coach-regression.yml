name: Chess coach regression
on:
  push:
    paths:
      - index.html
      - lambda-coach/index.mjs
      - tests/coach-regression.mjs
      - tests/coach-ai-regression.mjs
      - tests/coach-game-simulation.mjs
      - tests/coach-game-lines.json
      - tests/coach-release-scenarios.json
      - tests/coach-release-readiness.mjs
      - tests/stockfish-evidence.mjs
      - tests/coach-review-cases.json
      - stockfish-17.1-lite-single-03e3232.js
      - stockfish-17.1-lite-single-03e3232.wasm
      - .github/workflows/coach-regression.yml
  pull_request:
    paths:
      - index.html
      - lambda-coach/index.mjs
      - tests/coach-regression.mjs
      - tests/coach-game-simulation.mjs
      - tests/coach-release-scenarios.json
      - tests/coach-release-readiness.mjs
      - .github/workflows/coach-regression.yml
jobs:
  deterministic-chess-checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check lambda-coach/index.mjs
      - run: node --test tests/coach-regression.mjs
      - run: node tests/coach-ai-regression.mjs
      - run: node tests/coach-ai-regression.mjs --group engine --stockfish --depth 12
      - run: node tests/coach-ai-regression.mjs --group middlegame --stockfish --depth 12
      - run: node tests/coach-ai-regression.mjs --group balance --stockfish --depth 12
      - run: node tests/coach-game-simulation.mjs --validate-only
      - run: node tests/coach-game-simulation.mjs --depth 10
      - run: node tests/coach-game-simulation.mjs --suite release --validate-only
      - run: node tests/coach-game-simulation.mjs --suite release --depth 10
      - run: node tests/coach-release-readiness.mjs --self-test
